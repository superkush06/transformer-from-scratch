[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfs"
version = "0.5.0"
description = "Decoder-only transformer in NumPy with manual backprop."
authors = [{name = "superkush06"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["tfs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells are read top to bottom by a person, not maintained as a
# module. Semicolons keep a plotting cell compact and a `for step in range(n)`
# that ignores its counter reads better than `for _ in`.
"notebooks/*.ipynb" = ["E702", "B007"]
