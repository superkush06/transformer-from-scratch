name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    # Two operating systems on purpose. Every claim in this repository is a
    # float64 number, and reduction order is not part of NumPy's API — a
    # divergence between macOS/Accelerate and Linux/OpenBLAS is exactly the
    # failure this suite exists to catch.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Versions
        if: always()
        run: python -c "import numpy, sys; print(numpy.__version__, sys.version)"
